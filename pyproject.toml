[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docencia-tools"
version = "0.1.0.dev0"
description = "Automatización auditable y reusable para entregas docentes en GitHub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
docencia-tools = "docencia_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docencia_tools = ["templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
